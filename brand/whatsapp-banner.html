<style>
*{margin:0;box-sizing:border-box}
body{width:1500px;height:800px;overflow:hidden;background:#0F0F12}
.b{position:relative;width:1500px;height:800px;background:#0F0F12;color:#F5F0E6;font-family:Inter,sans-serif;overflow:hidden}
.b:before{content:"";position:absolute;inset:0;background:
 radial-gradient(55% 60% at 50% 0%,rgba(201,168,106,.20),transparent 70%),

.x{position:absolute;top:50%;transform:translateY(-50%);opacity:.07}

.rule.l{left:70px}.rule.r{right:70px;transform:scaleX(-1)}
.ring{position:absolute;left:50%;bottom:-190px;width:380px;height:380px;margin-left:-190px;border-radius:50%;border:1.5px solid rgba(201,168,106,.55)}
.ring2{position:absolute;left:50%;bottom:-230px;width:460px;height:460px;margin-left:-230px;border-radius:50%;border:1px dashed rgba(201,168,106,.22)}
